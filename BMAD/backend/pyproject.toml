[project]
name = "judian"
version = "0.1.0"
description = "聚點 空間租借系統後端"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B905", "UP046", "UP047", "E501", "B008", "SIM108", "C408", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "concurrency: 使用實際 PostgreSQL 的併發測試",
]
